# syntax-documentation:
#  - https://packaging.python.org/en/latest/specifications/pyproject-toml/
#  - https://docs.astral.sh/uv/concepts/projects/
#
# NOTE: you have to use single-quoted strings in TOML for regular expressions.
# It's the equivalent of r-strings in Python.  Multiline strings are treated as
# verbose regular expressions by Black.  Use [ ] to denote a significant space
# character.
#
#   > uv sync       installeer de dependencies uit uv.lock
#   > uv lock       werk uv.lock bij na een wijziging aan dependencies

[project]
name = "verzekeringen-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.30",
    "django>=5.2,<6.0",
    "dj-email-url>=1.0",
    "django-anymail[sendinblue]>=10.2",
    "django-cors-headers>=3.7",
    "django-extensions>=3.2.3",
    "django-filter>=26.2",
    "django-storages>=1.11",
    "djangorestframework>=3.18",
    "drf-yasg>=1.21.4",
    "environs>=10.0",
    "gunicorn>=26,<27",
    "jsonfield>=3.1",
    "mozilla-django-oidc>=2.0", # @TODO
    "packaging>=23.2",
    "pdfrw>=0.4",
    "psycopg2-binary>=2.9",
    "pyjwt>=2.3",
    "PyYAML>=6.0",
    # scouts-auth = {git = "ssh://git@gitlab.inuits.io:2224/boro/scouts_auth.git", rev = "master"}  # @TODO
    "urllib3>=2.8.0",
]

[dependency-groups]
# tools voor ontwikkeling en CI; Ansible installeert met --no-dev
dev = [
    "black>=24.4.2",
    "ruff>=0.0",
]

[tool.uv]
# applicatie, geen pakket: uv bouwt of installeert het project zelf niet
package = false


[tool.black]
line-length = 119
target-version = ['py311']
exclude = '''
/(
  | migrations
)/

'''


[tool.pytest.ini_options]
cache_dir = "var/cache/pytest"
log_cli = false   # enable to show log-output
log_cli_level = "NOTSET"
filterwarnings = []
markers = ["unit", "integration"]
pythonpath = [".", "verzekeringen_api"]
testpaths = ["tests"]
# the junit-report is used to report coverage in gitlab
addopts = "--color=yes --junit-xml='${BASE_DIR}/var/coverage/pytest.xml'"
django_debug_mode = "keep"
DJANGO_SETTINGS_MODULE = "verzekeringen_api.settings"


[tool.ruff]
# ruff searches for settings in the target-dir and up
# https://docs.astral.sh/ruff/configuration
cache-dir = "var/cache/ruff"
exclude = ["**/migrations/*.py"]
line-length = 120

[tool.ruff.format]
preview = true
