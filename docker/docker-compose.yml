
services:
  db:
    image: postgres:15
    container_name: verzekeringen_postgres
    restart: always
    environment:
      POSTGRES_DB: verzekeringen
      POSTGRES_USER: verzekeringen
      POSTGRES_PASSWORD: Azerty123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database-fix.sql:/docker-entrypoint-initdb.d/database-fix.sql
    ports:
      - "5432:5432"
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile_development
    container_name: verzekeringen_django
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DJANGO_SETTINGS_MODULE: verzekeringen_api.settings
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: verzekeringen
      DB_USER: verzekeringen
      DB_PASSWORD: Azerty123
      DEBUG: "True"
      SECRET_KEY: your_secret_here
      BASE_DIR: /app/verzekeringen_api

volumes:
  pgdata:
  pgadmin_data:
